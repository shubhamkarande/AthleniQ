name: athleniq
description: "AthleniQ - AI Fitness Coach in Your Pocket. Train smarter with real-time pose detection and personalized workout feedback."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Camera & Media
  camera: ^0.11.0+2
  image: ^4.3.0
  
  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  
  # UI Components
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  
  # Utilities
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1
  vibration: ^2.0.1
  flutter_tts: ^4.2.0
  intl: ^0.20.1
  uuid: ^4.5.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

